<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce - Đặt hàng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="container-fluid vh-100 d-none">
        <div class="row h-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="fas fa-sign-in-alt"></i> Đăng nhập</h4>
                    </div>
                    <div class="card-body">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Tên đăng nhập</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="login-btn">
                                <i class="fas fa-sign-in-alt"></i> Đăng nhập
                            </button>
                        </form>

                        <hr class="my-3">
                        <div class="text-center">
                            <small class="text-muted">Demo: admin / admin123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Screen -->
    <div id="main-screen" class="container-fluid vh-100 d-none">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-shopping-bag"></i> Mini Ecommerce
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="showScreen('products')">
                                <i class="fas fa-box"></i> Sản phẩm
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showScreen('orders')">
                                <i class="fas fa-list"></i> Đơn hàng của tôi
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="fas fa-user"></i> <span id="user-name">User</span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="logout()">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Content Area -->
        <div class="container-fluid" style="height: calc(100vh - 76px);">
            <!-- Products Screen -->
            <div id="products-screen" class="row h-100">
                <!-- Cart Section (20%) -->
                <div class="col-3 bg-light border-end p-3" id="cart-section">
                    <h4 class="mb-3">
                        <i class="fas fa-shopping-cart"></i> Giỏ hàng
                    </h4>
                    <div id="cart-items" class="mb-3">
                        <!-- Cart items will be added here -->
                    </div>
                    <div class="mt-auto">
                        <button id="order-btn" class="btn btn-success w-100" disabled>
                            <i class="fas fa-check"></i> Đặt hàng
                        </button>
                    </div>
                </div>

                <!-- Products Section (80%) -->
                <div class="col-9 p-3" id="products-section">
                    <h4 class="mb-3">
                        <i class="fas fa-box"></i> Sản phẩm
                    </h4>

                    <!-- Search Section -->
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm...">
                                <button id="search-btn" class="btn btn-primary">
                                    <i class="fas fa-search"></i> Tìm kiếm
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div id="pagination-info" class="text-muted mt-2">
                                <!-- Pagination info will be shown here -->
                            </div>
                        </div>
                    </div>

                    <!-- Pagination Controls -->
                    <div class="d-flex justify-content-center mb-3" id="pagination-controls">
                        <!-- Pagination buttons will be added here -->
                    </div>

                    <!-- Products Grid -->
                    <div id="products-grid" class="row">
                        <!-- Products will be loaded here -->
                    </div>

                    <!-- Loading Spinner -->
                    <div id="loading-spinner" class="text-center d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Orders Screen -->
            <div id="orders-screen" class="row h-100 d-none">
                <div class="col-12 p-4">
                    <h4 class="mb-3">
                        <i class="fas fa-list"></i> Đơn hàng của tôi
                    </h4>

                    <div id="orders-container">
                        <!-- Orders will be loaded here -->
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Đang tải đơn hàng...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Form Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderModalLabel">
                        <i class="fas fa-shopping-cart"></i> Xác nhận đặt hàng
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="order-form">
                        <!-- Order Items Summary -->
                        <div class="mb-4">
                            <h6 class="mb-3">Sản phẩm đã chọn:</h6>
                            <div id="order-items-summary" class="border rounded p-3 bg-light">
                                <!-- Order items will be populated here -->
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div class="mb-3">
                            <label for="payment-method" class="form-label fw-bold">
                                <i class="fas fa-credit-card"></i> Phương thức thanh toán
                            </label>
                            <select class="form-select" id="payment-method" required>
                                <option value="CASH" selected>Tiền mặt (CASH)</option>
                                <option value="CREDIT_CARD">Thẻ tín dụng (CREDIT_CARD)</option>
                            </select>
                        </div>

                        <!-- Shipment Method -->
                        <div class="mb-3">
                            <label for="shipment-method" class="form-label fw-bold">
                                <i class="fas fa-truck"></i> Phương thức giao hàng
                            </label>
                            <select class="form-select" id="shipment-method" required>
                                <option value="STANDARD" selected>Giao hàng tiêu chuẩn (STANDARD)</option>
                                <option value="EXPRESS">Giao hàng nhanh (EXPRESS)</option>
                            </select>
                        </div>

                        <!-- Shipping Address -->
                        <div class="mb-3">
                            <label for="shipping-address" class="form-label fw-bold">
                                <i class="fas fa-map-marker-alt"></i> Địa chỉ giao hàng
                            </label>
                            <textarea class="form-control" id="shipping-address" rows="3"
                                placeholder="Nhập địa chỉ giao hàng chi tiết..." required></textarea>
                            <div class="invalid-feedback">
                                Vui lòng nhập địa chỉ giao hàng.
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label for="order-notes" class="form-label fw-bold">
                                <i class="fas fa-sticky-note"></i> Ghi chú (tùy chọn)
                            </label>
                            <textarea class="form-control" id="order-notes" rows="2"
                                placeholder="Nhập ghi chú đặc biệt cho đơn hàng..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Hủy
                    </button>
                    <button type="button" class="btn btn-success" id="confirm-order-btn">
                        <i class="fas fa-check"></i> Xác nhận đặt hàng
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
