<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce - Quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, sans-serif; }
        .admin-sidebar { width: 280px; background: #f8f9fa; border-right: 1px solid #dee2e6; }
        .admin-content { flex: 1; overflow-y: auto; background: white; }
        .pagination-btn { margin: 0 4px; padding: 8px 16px; background: white; border: 1px solid #dee2e6; border-radius: 6px; cursor: pointer; }
        .pagination-btn.active { background: #0d6efd; color: white; border-color: #0d6efd; }
        .alert { margin-top: 15px; }

        /* Nút X trong ô tìm kiếm - đẹp & chuẩn Bootstrap */
        .btn-clear-search {
            display: none;
            border: none;
            background: transparent;
        }
        .btn-clear-search:hover {
            color: #dc3545 !important;
        }
        .input-group .form-control:focus ~ .btn-clear-search,
        .input-group .form-control:not(:placeholder-shown) ~ .btn-clear-search {
            display: block;
        }
    </style>
</head>
<body class="bg-light">

<!-- Login Screen -->
<div id="login-screen" class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-primary text-white">
    <div class="text-center">
        <h1>Admin Login</h1>
        <p class="mt-3 fs-5">Chỉ dành cho quản trị viên</p>
        <button class="btn btn-light btn-lg mt-4 px-5" onclick="adminLogin()">Đăng nhập</button>
    </div>
</div>

<!-- Main Admin Screen -->
<div id="main-screen" class="d-none">
    <div class="d-flex" style="height: 100vh;">
        <!-- Sidebar -->
        <div class="admin-sidebar p-4 shadow-sm">
            <h4 class="text-primary mb-4">Quản trị</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a class="nav-link text-dark fw-bold active" href="#" onclick="showScreen('categories')">Danh mục</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-dark fw-bold" href="#" onclick="showScreen('products')">Sản phẩm</a>
                </li>
                <hr>
                <li class="nav-item">
                    <a class="nav-link text-danger" href="#" onclick="logout()">Đăng xuất</a>
                </li>
            </ul>
        </div>

        <!-- Content -->
        <div class="admin-content p-4">
            <!-- Categories -->
            <div id="categories-screen">
                <h3 class="mb-4">Quản lý Danh mục</h3>
                <div class="row">
                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <form id="category-form">
                                    <input type="hidden" id="category-id">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên danh mục *</label>
                                        <input type="text" class="form-control" id="category-name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Mô tả</label>
                                        <textarea class="form-control" id="category-description" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <span id="category-btn-text">Tạo mới</span>
                                    </button>
                                    <button type="button" class="btn btn-secondary ms-2" onclick="resetCategoryForm()">Reset</button>
                                </form>
                                <div id="category-alert" class="alert d-none mt-3"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <!-- TÌM KIẾM DANH MỤC - ĐẸP NHẤT -->
                        <div class="input-group mb-3" style="max-width: 500px;">
                            <input
                                    type="text"
                                    id="category-search"
                                    class="form-control"
                                    placeholder="Tìm kiếm danh mục..."
                                    autocomplete="off">
                            <button class="btn btn-outline-secondary btn-clear-search" type="button" id="clear-category-search" onclick="clearCategorySearch()">
                                <i class="fas fa-times"></i>
                            </button>
                            <button class="btn btn-outline-primary" type="button" onclick="searchCategories()">
                                <i class="fas fa-search"></i> Tìm
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover" id="categories-table">
                                <thead class="table-dark">
                                <tr>
                                    <th style="width:80px;">ID</th>
                                    <th>Tên</th>
                                    <th>Mô tả</th>
                                    <th style="width:170px; text-align:center;">Hành động</th>
                                </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <div id="category-pagination" class="text-center mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Products -->
            <div id="products-screen" class="d-none">
                <h3 class="mb-4">Quản lý Sản phẩm</h3>
                <div class="row">
                    <div class="col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <form id="product-form">
                                    <input type="hidden" id="product-id">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Tên sản phẩm *</label>
                                        <input type="text" class="form-control" id="product-name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Mô tả *</label>
                                        <textarea class="form-control" id="product-description" required rows="3"></textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label fw-bold">Giá (VND) *</label>
                                            <input type="number" class="form-control" id="product-price" min="1000" required>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label fw-bold">Tồn kho *</label>
                                            <input type="number" class="form-control" id="product-stock" min="0" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Danh mục *</label>
                                        <select class="form-select" id="product-category" required>
                                            <option value="">Chọn danh mục</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <span id="product-btn-text">Tạo mới</span>
                                    </button>
                                    <button type="button" class="btn btn-secondary ms-2" onclick="resetProductForm()">Reset</button>
                                </form>
                                <div id="product-alert" class="alert d-none mt-3"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <!-- TÌM KIẾM SẢN PHẨM - SIÊU ĐẸP -->
                        <div class="input-group mb-3" style="max-width: 680px;">
                            <input
                                    type="text"
                                    id="product-search"
                                    class="form-control"
                                    placeholder="Tìm sản phẩm..."
                                    autocomplete="off">
                            <button class="btn btn-outline-secondary btn-clear-search" type="button" id="clear-product-search" onclick="clearProductSearch()">
                                <i class="fas fa-times"></i>
                            </button>
                            <select id="product-category-filter"
                                    class="form-select"
                                    style="max-width:180px"
                                    onchange="filterByCategory()">
                                <option value="">Tất cả danh mục</option>
                            </select>
                            <button class="btn btn-outline-primary" type="button" onclick="searchProducts()">
                                <i class="fas fa-search"></i> Tìm
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover" id="products-table">
                                <thead class="table-dark">
                                <tr>
                                    <th style="width:80px;">ID</th>
                                    <th>Tên</th>
                                    <th style="width:130px;">Giá</th>
                                    <th style="width:100px;">Tồn kho</th>
                                    <th>Danh mục</th>
                                    <th style="width:170px; text-align:center;">Hành động</th>
                                </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                        <div id="product-pagination" class="text-center mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
