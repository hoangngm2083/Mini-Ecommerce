<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce - Demo (Offline)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="container-fluid vh-100 show">
        <div class="row h-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="fas fa-sign-in-alt"></i> Đăng nhập (Demo)</h4>
                    </div>
                    <div class="card-body">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Tên đăng nhập</label>
                                <input type="text" class="form-control" id="username" value="admin" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" value="admin123" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="login-btn">
                                <i class="fas fa-sign-in-alt"></i> Đăng nhập
                            </button>
                        </form>

                        <hr class="my-3">
                        <div class="text-center">
                            <small class="text-muted">Demo: admin / admin123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Screen -->
    <div id="main-screen" class="container-fluid vh-100 d-none">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-shopping-bag"></i> Mini Ecommerce (Demo)
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="showScreen('products')">
                                <i class="fas fa-box"></i> Sản phẩm
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showScreen('orders')">
                                <i class="fas fa-list"></i> Đơn hàng của tôi
                            </a>
                        </li>
                    </ul>

                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="fas fa-user"></i> <span id="user-name">User</span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="logout()">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Content Area -->
        <div class="container-fluid" style="height: calc(100vh - 76px);">
            <!-- Products Screen -->
            <div id="products-screen" class="row h-100">
                <!-- Cart Section (20%) -->
                <div class="col-3 bg-light border-end p-3" id="cart-section">
                    <h4 class="mb-3">
                        <i class="fas fa-shopping-cart"></i> Giỏ hàng
                    </h4>
                    <div id="cart-items" class="mb-3">
                        <div class="empty-cart">
                            <i class="fas fa-shopping-cart fa-2x mb-2"></i>
                            <p>Giỏ hàng trống</p>
                        </div>
                    </div>
                    <div class="mt-auto">
                        <button id="order-btn" class="btn btn-success w-100" disabled>
                            <i class="fas fa-check"></i> Đặt hàng
                        </button>
                    </div>
                </div>

                <!-- Products Section (80%) -->
                <div class="col-9 p-3" id="products-section">
                    <h4 class="mb-3">
                        <i class="fas fa-box"></i> Sản phẩm (Demo)
                    </h4>

                    <!-- Search Section -->
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm sản phẩm...">
                                <button id="search-btn" class="btn btn-primary">
                                    <i class="fas fa-search"></i> Tìm kiếm
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div id="pagination-info" class="text-muted mt-2">
                                Hiển thị 1-8 trong tổng số 8 sản phẩm
                            </div>
                        </div>
                    </div>

                    <!-- Products Grid -->
                    <div id="products-grid" class="row">
                        <!-- Demo products will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Orders Screen -->
            <div id="orders-screen" class="row h-100 d-none">
                <div class="col-12 p-4">
                    <h4 class="mb-3">
                        <i class="fas fa-list"></i> Đơn hàng của tôi (Demo)
                    </h4>

                    <div id="orders-container">
                        <!-- Orders will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Screen Management */
        #login-screen, #main-screen {
            display: none;
        }

        #login-screen.show, #main-screen.show {
            display: block !important;
        }

        /* Main Screen Layout */
        #cart-section {
            min-height: 100%;
            position: sticky;
            top: 0;
        }

        #products-screen, #orders-screen {
            height: 100%;
        }

        .empty-cart {
            text-align: center;
            color: #6c757d;
            padding: 20px;
        }

        .product-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s ease;
        }

        .product-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-price {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
        }

        .product-stock {
            color: #6c757d;
            font-size: 0.9em;
        }

        .btn-add-cart {
            width: 100%;
            margin-top: 10px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
            background: white;
        }

        .cart-item-info {
            flex: 1;
            margin-right: 10px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quantity-controls button {
            width: 30px;
            height: 30px;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .quantity-controls button:hover {
            background: #f8f9fa;
        }

        .quantity-controls input {
            width: 50px;
            text-align: center;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            padding: 2px 5px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .col-3, .col-9 {
                flex: 0 0 100%;
                max-width: 100%;
            }

            #cart-section {
                order: 2;
                min-height: auto;
            }

            #products-section {
                order: 1;
            }
        }
    </style>
    <script>
        // Demo state
        let currentUser = null;
        let cart = [];
        let currentScreen = 'products';

        // Screen management
        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const productsScreen = document.getElementById('products-screen');
        const ordersScreen = document.getElementById('orders-screen');
        const userName = document.getElementById('user-name');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            showLoginScreen(); // Start with login screen
        });

        function setupEventListeners() {
            document.getElementById('login-form').addEventListener('submit', handleLogin);
            document.getElementById('search-btn').addEventListener('click', handleSearch);
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSearch();
            });
            document.getElementById('order-btn').addEventListener('click', handleOrder);
        }

        function checkAuthentication() {
            if (currentUser) {
                showMainScreen();
                loadInitialData();
            } else {
                showLoginScreen();
            }
        }

        function showLoginScreen() {
            loginScreen.classList.remove('d-none');
            mainScreen.classList.add('d-none');
        }

        function showMainScreen() {
            loginScreen.classList.add('d-none');
            mainScreen.classList.remove('d-none');
            if (userName) {
                userName.textContent = currentUser.username;
            }
        }

        function showScreen(screenName) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            if (screenName === 'products') {
                productsScreen.classList.remove('d-none');
                ordersScreen.classList.add('d-none');
                document.querySelector('a[onclick*="products"]').classList.add('active');
                displayProducts(demoProducts);
            } else if (screenName === 'orders') {
                productsScreen.classList.add('d-none');
                ordersScreen.classList.remove('d-none');
                document.querySelector('a[onclick*="orders"]').classList.add('active');
                loadUserOrders();
            }
        }

        function loadInitialData() {
            showScreen('products');
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'admin' && password === 'admin123') {
                currentUser = {
                    id: 1,
                    username: username,
                    email: username + '@example.com'
                };
                showMainScreen();
                loadInitialData();
                alert('Đăng nhập thành công!');
            } else {
                alert('Sai thông tin đăng nhập! Sử dụng: admin / admin123');
            }
        }

        function logout() {
            if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                currentUser = null;
                cart = [];
                showLoginScreen();
                alert('Đã đăng xuất thành công');
            }
        }

        // Demo data
        const demoProducts = [
            { id: 1, name: "iPhone 15 Pro", description: "Điện thoại cao cấp của Apple", price: 25000000, stockQuantity: 10 },
            { id: 2, name: "Samsung Galaxy S24", description: "Điện thoại Android flagship", price: 20000000, stockQuantity: 15 },
            { id: 3, name: "MacBook Air M3", description: "Laptop siêu mỏng của Apple", price: 35000000, stockQuantity: 5 },
            { id: 4, name: "Dell XPS 13", description: "Laptop doanh nhân", price: 28000000, stockQuantity: 8 },
            { id: 5, name: "Sony WH-1000XM5", description: "Tai nghe chống ồn", price: 8000000, stockQuantity: 20 },
            { id: 6, name: "AirPods Pro", description: "Tai nghe không dây Apple", price: 5000000, stockQuantity: 25 },
            { id: 7, name: "iPad Air", description: "Máy tính bảng Apple", price: 15000000, stockQuantity: 12 },
            { id: 8, name: "Samsung Tab S9", description: "Máy tính bảng Android", price: 18000000, stockQuantity: 7 }
        ];

        let cart = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayProducts(demoProducts);
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('search-btn').addEventListener('click', handleSearch);
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSearch();
            });
            document.getElementById('order-btn').addEventListener('click', handleOrder);
        }

        function handleSearch() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = keyword ?
                demoProducts.filter(p => p.name.toLowerCase().includes(keyword) || p.description.toLowerCase().includes(keyword)) :
                demoProducts;

            displayProducts(filtered);
            document.getElementById('pagination-info').textContent =
                `Hiển thị 1-${filtered.length} trong tổng số ${filtered.length} sản phẩm`;
        }

        function displayProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';

                col.innerHTML = `
                    <div class="product-card">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text text-muted">${product.description}</p>
                        <div class="product-price">₫${product.price.toLocaleString('vi-VN')}</div>
                        <div class="product-stock">Còn lại: ${product.stockQuantity}</div>
                        <button class="btn btn-primary btn-add-cart"
                                onclick="addToCart(${product.id}, '${product.name}', ${product.price}, ${product.stockQuantity})"
                                ${product.stockQuantity <= 0 ? 'disabled' : ''}>
                            <i class="fas fa-cart-plus"></i>
                            ${product.stockQuantity <= 0 ? 'Hết hàng' : 'Thêm vào giỏ'}
                        </button>
                    </div>
                `;

                grid.appendChild(col);
            });
        }

        function addToCart(productId, productName, price, maxStock) {
            const existingItem = cart.find(item => item.productId === productId);

            if (existingItem) {
                if (existingItem.quantity < maxStock) {
                    existingItem.quantity += 1;
                } else {
                    alert(`Không thể thêm. Chỉ còn ${maxStock} sản phẩm trong kho.`);
                    return;
                }
            } else {
                cart.push({
                    productId: productId,
                    name: productName,
                    price: price,
                    quantity: 1,
                    maxStock: maxStock
                });
            }

            updateCartDisplay();
            alert('Đã thêm sản phẩm vào giỏ hàng!');
        }

        function updateCartDisplay() {
            const cartItems = document.getElementById('cart-items');

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart fa-2x mb-2"></i>
                        <p>Giỏ hàng trống</p>
                    </div>
                `;
                document.getElementById('order-btn').disabled = true;
                return;
            }

            cartItems.innerHTML = '';
            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cart-item';

                div.innerHTML = `
                    <div class="cart-item-info">
                        <div class="fw-bold">${item.name}</div>
                        <div class="text-muted">₫${item.price.toLocaleString('vi-VN')}</div>
                    </div>
                    <div class="cart-item-controls">
                        <div class="quantity-controls">
                            <button onclick="changeQuantity(${index}, -1)" ${item.quantity <= 1 ? 'disabled' : ''}>-</button>
                            <input type="number" value="${item.quantity}" readonly min="1" max="${item.maxStock}">
                            <button onclick="changeQuantity(${index}, 1)" ${item.quantity >= item.maxStock ? 'disabled' : ''}>+</button>
                        </div>
                        <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeFromCart(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;

                cartItems.appendChild(div);
            });

            document.getElementById('order-btn').disabled = false;
        }

        function changeQuantity(index, delta) {
            const item = cart[index];
            const newQuantity = item.quantity + delta;

            if (newQuantity >= 1 && newQuantity <= item.maxStock) {
                item.quantity = newQuantity;
                updateCartDisplay();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function handleOrder() {
            if (cart.length === 0) {
                alert('Giỏ hàng trống!');
                return;
            }

            const orderSummary = cart.map(item =>
                `${item.name} x${item.quantity} = ₫${(item.price * item.quantity).toLocaleString('vi-VN')}`
            ).join('\n');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            alert(`Đặt hàng thành công!\n\n${orderSummary}\n\nTổng cộng: ₫${total.toLocaleString('vi-VN')}`);

            cart = [];
            updateCartDisplay();
        }

        function loadUserOrders() {
            const ordersContainer = document.getElementById('orders-container');

            const mockOrders = [
                {
                    id: 1,
                    createdAt: '2024-01-15T10:30:00',
                    status: 'COMPLETED',
                    totalAmount: 2500000,
                    items: [
                        { productName: 'iPhone 15 Pro', quantity: 1, price: 2500000 }
                    ]
                },
                {
                    id: 2,
                    createdAt: '2024-01-10T14:20:00',
                    status: 'PENDING',
                    totalAmount: 1500000,
                    items: [
                        { productName: 'MacBook Air M3', quantity: 1, price: 1500000 }
                    ]
                }
            ];

            ordersContainer.innerHTML = mockOrders.map(order => `
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas fa-receipt"></i> Đơn hàng #${order.id}
                        </h6>
                        <span class="badge bg-${order.status === 'COMPLETED' ? 'success' : 'warning'}">${order.status === 'COMPLETED' ? 'Hoàn thành' : 'Chờ xử lý'}</span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <h6>Sản phẩm:</h6>
                                <ul class="list-unstyled">
                                    ${order.items.map(item => `
                                        <li>${item.productName} x${item.quantity} - ₫${item.price.toLocaleString('vi-VN')}</li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="col-md-4 text-end">
                                <p class="mb-1"><strong>Tổng tiền:</strong></p>
                                <h5 class="text-primary">₫${order.totalAmount.toLocaleString('vi-VN')}</h5>
                                <small class="text-muted">${new Date(order.createdAt).toLocaleDateString('vi-VN')}</small>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Global functions for onclick handlers
        window.showScreen = showScreen;
        window.logout = logout;
    </script>
</body>
</html>
